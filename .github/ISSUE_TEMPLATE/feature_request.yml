name: Feature Request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? Great — describe it clearly and we'll discuss it.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or gap this feature addresses.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should the new behaviour look like?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Did you consider any other approaches?

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - New tool
        - Improvement to existing tool
        - New resource
        - DX / configuration
        - Documentation
        - Other
    validations:
      required: true
